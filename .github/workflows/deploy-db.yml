# Database deployments on merge to main.
#
# push-dev: applies pending migrations to scl-dev automatically.
# push-prod: exists and is ready, but is gated by the `production-db`
#   GitHub Environment (required reviewer approval). Approving it is a
#   deliberate, manual decision — the first real use will be the
#   project_lead rename migration.
name: Deploy DB

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-db.yml"

concurrency:
  group: deploy-db
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.75.0

jobs:
  push-dev:
    name: db push → scl-dev
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase link --project-ref mzotiurydmhibqhxxzoh
      - run: supabase db push

  push-prod:
    name: db push → production (manual approval)
    needs: push-dev
    runs-on: ubuntu-latest
    environment: production-db
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase link --project-ref tfbzivfsqsgebegcvfah
      - run: supabase db push
