# Database deployments.
#
# push (main): applies pending migrations AND config.toml to scl-dev
#   automatically. Config sync is dev-only by design: config push to prod
#   stays a manual, consented operation (ADR-0007) — do not add it to
#   push-prod.
# workflow_dispatch: applies pending migrations to PRODUCTION. Still gated by
#   the `production-db` GitHub Environment (required reviewer approval), and
#   additionally must be dispatched from main. The first real use will be the
#   project_lead rename migration — a deliberate, manual decision.
#
# Prod is a separate trigger on purpose: a push-triggered prod job waiting for
# approval used to hold the run-level `deploy-db` concurrency group, which
# left every subsequent merge's deploy run pending with no jobs. Split
# triggers + per-event groups mean push runs finish as soon as the dev push
# does, and a waiting prod dispatch can never block dev deploys.
name: Deploy DB

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-db.yml"
  workflow_dispatch:

concurrency:
  group: deploy-db-${{ github.event_name }}
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.75.0

jobs:
  push-dev:
    name: db push → scl-dev
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # Token scoped to the SCL-DEV project only. Deliberately NOT a
      # prod-capable token: repository secrets are readable by any workflow
      # on any branch, so a prod-scoped token here would let a custom
      # workflow bypass the production-db approval gate.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_DEV }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase link --project-ref mzotiurydmhibqhxxzoh
      - run: supabase db push
      # Keeps scl-dev's project configuration in sync with config.toml
      # ([remotes.scldev] override applies by project ref) — without this a
      # merged config change sat invisible until someone pushed it by hand
      # (bit us with [api].schemas after DCS 1a.05). Requires the token to
      # hold config read/write for the API, Auth, Database and Storage
      # sections, not just what `db push` needs.
      - run: supabase config push --yes

  push-prod:
    name: db push → production (manual approval)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-db
    env:
      # Prod-scoped token lives ONLY in the production-db environment, so it
      # is released exclusively to runs that passed the manual approval gate.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_PROD }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase link --project-ref tfbzivfsqsgebegcvfah
      - run: supabase db push
